<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Orbs Partner Portal" />
    <meta name="apple-mobile-web-app-title" content="Orbs Partner Portal" />
    <meta name="theme-color" content="#f8f9fc" />
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("perpetual-hub-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {}
        const theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.classList.add(theme);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#10131c" : "#f8f9fc";
      })();
    </script>
    <meta
      name="description"
      content="Set up Spot or perps trading for your community with Orbs. Choose your app name and fees wallet, then integrate through our docs or API."
    />
    <meta property="og:site_name" content="Orbs Partner Portal" />
    <meta property="og:title" content="Orbs Partner Portal" />
    <meta
      property="og:description"
      content="Set up Spot or perps trading for your community with Orbs."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/montserrat/Montserrat-Latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/montserrat/montserrat.css" />
    <title>Orbs Partner Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
